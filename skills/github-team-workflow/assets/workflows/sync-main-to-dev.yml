# Opens a direct `main -> dev` PR only when `dev` has not diverged ahead of `main`.
# When `main` and `dev` have diverged, skips creating a PR that would be blocked by
# "Require branches to be up to date before merging" on `dev`, and writes exact
# `sync/main-<sha>-to-dev` commands to the GitHub Actions job summary instead.
# (Never merge `dev` into `main` to satisfy the up-to-date check.)
name: Sync main to dev

on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  open-backmerge-pr:
    name: Sync main back to dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inspect main and dev ancestry
        id: check
        run: |
          git fetch origin main dev
          MAIN_FULL_SHA=$(git rev-parse origin/main)
          MAIN_SHORT_SHA=$(git rev-parse --short "$MAIN_FULL_SHA")
          echo "main_full_sha=$MAIN_FULL_SHA" >> "$GITHUB_OUTPUT"
          echo "main_short_sha=$MAIN_SHORT_SHA" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor origin/main origin/dev; then
            echo "mode=up_to_date" >> "$GITHUB_OUTPUT"
          elif git merge-base --is-ancestor origin/dev origin/main; then
            echo "mode=direct_pr" >> "$GITHUB_OUTPUT"
          else
            echo "mode=diverged" >> "$GITHUB_OUTPUT"
          fi

      - name: Create direct back-merge PR (main -> dev)
        if: steps.check.outputs.mode == 'direct_pr'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh pr list --base dev --head main --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "Back-merge PR #$existing already open."
            exit 0
          fi
          gh pr create \
            --base dev \
            --head main \
            --title "chore(sync): back-merge main into dev" \
            --body "Automated back-merge after changes landed on \`main\`. Merge this PR using **Merge commit** (never Squash merge) to preserve Git merge ancestry."

      - name: Publish sync/* instructions when main and dev diverged
        if: steps.check.outputs.mode == 'diverged'
        env:
          MAIN_FULL_SHA: ${{ steps.check.outputs.main_full_sha }}
          MAIN_SHORT_SHA: ${{ steps.check.outputs.main_short_sha }}
        run: |
          SYNC_BRANCH="sync/main-${MAIN_SHORT_SHA}-to-dev"
          echo "::notice::main ($MAIN_SHORT_SHA) and dev have diverged. Skipped direct main -> dev PR to avoid strict up-to-date check deadlocks; see the job summary for exact sync/* commands."
          SUMMARY_FILE="${GITHUB_STEP_SUMMARY:-/dev/null}"
          sed \
            -e "s|__SYNC_BRANCH__|${SYNC_BRANCH}|g" \
            -e "s|__MAIN_FULL_SHA__|${MAIN_FULL_SHA}|g" \
            -e "s|__MAIN_SHORT_SHA__|${MAIN_SHORT_SHA}|g" <<'EOF' >> "$SUMMARY_FILE"
          ### Manual back-merge required (`main` and `dev` diverged)

          Skipped creating a direct `main -> dev` PR because `dev` has commits ahead of `main`. Under **Require branches to be up to date before merging**, a direct `main -> dev` PR would be blocked—and you must **never** merge `dev` into `main`.

          Run these commands to back-merge exact commit `__MAIN_FULL_SHA__` via a temporary `sync/*` branch cut from `origin/dev`:

          ```bash
          git fetch origin
          git switch --no-track -c __SYNC_BRANCH__ origin/dev
          git merge --no-ff __MAIN_FULL_SHA__
          git push -u origin __SYNC_BRANCH__
          gh pr create \
            --base dev \
            --head __SYNC_BRANCH__ \
            --title "chore(sync): back-merge main (__MAIN_SHORT_SHA__) into dev" \
            --body "Back-merge \`main\` (\`__MAIN_FULL_SHA__\`) into \`dev\`. Merge using **Merge commit** (never Squash merge)."
          ```
          EOF
