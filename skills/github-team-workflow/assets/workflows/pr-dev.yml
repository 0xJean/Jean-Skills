# Template workflow: replace the intentional fail-closed `exit 1` placeholder
# in the `ci` job with this repository's real lint, unit test, and build commands
# before committing, otherwise every matching PR will fail.
name: PR to dev and release

on:
  pull_request:
    branches: [dev, 'release/*']
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  branch-check:
    name: Validate source branch
    runs-on: ubuntu-latest
    steps:
      - name: Enforce allowed source branches for dev and release/*
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [[ "$BASE_REF" == release/* ]]; then
            if [[ "$HEAD_REF" =~ ^(fix|docs|chore)/.+ ]]; then
              echo "Allowed freeze-period branch '$HEAD_REF' for '$BASE_REF'."
            else
              echo "Freeze-period branch '$BASE_REF' accepts only fix/*, docs/*, or chore/*; got '$HEAD_REF'."
              exit 1
            fi
          elif [[ "$HEAD_REF" == "main" || "$HEAD_REF" =~ ^(feat|fix|chore|refactor|docs|test|ci|perf|sync|release)/.+ ]]; then
            echo "Allowed source branch '$HEAD_REF' for '$BASE_REF'."
          else
            echo "Invalid source branch '$HEAD_REF' for '$BASE_REF'. Use feat/*, fix/*, chore/*, refactor/*, docs/*, sync/*, release/*, or main."
            exit 1
          fi

  title-lint:
    name: Validate Conventional Commit PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  secret-scan:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Note: gitleaks-action@v2 requires GITLEAKS_LICENSE on GitHub Organization repos.
      # For org repos without a license, run the open-source gitleaks CLI binary or enable GitHub Secret Scanning.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  issue-link-advisory:
    name: Advisory Issue link check
    runs-on: ubuntu-latest
    if: startsWith(github.head_ref, 'feat/') || startsWith(github.head_ref, 'fix/')
    steps:
      - name: Warn if PR body does not reference an Issue
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if echo "$PR_BODY" | grep -Eiq '(closes|fixes|refs)[[:space:]]+#[0-9]+'; then
            echo "Linked Issue reference found."
          else
            echo "::warning::Consider linking a GitHub Issue in the PR description (Closes #123, Fixes #123, or Refs #123 for intermediate PRs)."
          fi

  ci:
    name: Lint, unit tests, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Adapt the setup and verification commands below to this repository's stack.
      - name: Run repository checks
        run: |
          echo "Configure lint, unit test (with coverage), and build commands for this repository."
          exit 1
