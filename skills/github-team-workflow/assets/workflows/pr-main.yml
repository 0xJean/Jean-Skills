# Template workflow: replace the intentional fail-closed `exit 1` placeholder
# in `full-verification` with this repository's real verification commands
# before committing, otherwise every PR to main will fail.
# Note: Because `labeled`/`unlabeled` triggers this workflow for `qa-gate`, heavy
# E2E suites in `full-verification` will re-run when labels change. If E2E runs are
# expensive, move `qa-gate` into its own dedicated workflow rather than adding an
# `if:` condition to skip required jobs (GitHub treats skipped required checks as passing).
name: PR to main

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  source-check:
    name: Enforce release/* or hotfix/* source
    runs-on: ubuntu-latest
    steps:
      - name: Allow only release/* and hotfix/* branches
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ "$HEAD_REF" =~ ^(release|hotfix)/.+ ]]; then
            echo "Allowed release/hotfix source branch: $HEAD_REF"
          else
            echo "main accepts only release/* or hotfix/* branches; got '$HEAD_REF'."
            exit 1
          fi

  qa-gate:
    name: Verify QA sign-off label
    runs-on: ubuntu-latest
    steps:
      # Note: checking the `qa-approved` label is a lightweight workflow signal only;
      # GitHub labels do not verify who applied them. If designated QA sign-off identity
      # is required, enforce it via QA team PR review / CODEOWNERS, a GitHub Environment
      # reviewer gate, or a workflow check verifying an APPROVED review from the QA team.
      - name: Require qa-approved label
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          if jq -e 'index("qa-approved") != null' <<< "$LABELS" >/dev/null; then
            echo "QA sign-off label present."
          else
            echo "Missing required 'qa-approved' label after staging verification."
            exit 1
          fi

  dependency-review:
    name: Dependency vulnerability review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Note: dependency-review-action requires GitHub Dependency Graph (and GitHub
      # Code Security / Advanced Security on private repositories). For private repos
      # without it, replace with a stack-native audit tool (e.g. npm/pip/govulncheck).
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  secret-scan:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Note: gitleaks-action@v2 requires GITLEAKS_LICENSE on GitHub Organization repos.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  full-verification:
    name: Full test, integration, and build checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Adapt the steps below to run lint, unit tests, integration/E2E tests,
      # database migration validation, and production build checks.
      - name: Run release verification suite
        run: |
          echo "Configure lint, unit, integration/E2E, migration, and build checks for this repository."
          exit 1
